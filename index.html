n = int(input())
T = [0] + list(map(int, input().split()))

dp = [0] * (n + 1)

dp[1] = T[1]
for i in range(2, n + 1):
    dp[i] = max(dp[i-1], dp[i-2] + T[i])

print(dp[n])

i = n
telkek = []
while i >= 1:
    if i == 1:
        telkek.append(1)
        break
    if dp[i] == dp[i-1]:
        i -= 1
    else:
        telkek.append(i)
        i -= 2

telkek.sort()
print(*telkek)`,

        2: `# Állatkert (Gráfok)
N, M = map(int, input().split())

deg = [0] * (N + 1)
for _ in range(M):
    u, v = map(int, input().split())
    deg[u] += 1
    deg[v] += 1

dead_ends = sum(1 for i in range(1, N + 1) if deg[i] == 1)

max_deg = max(deg[1:])
max_node = deg.index(max_deg)

print(dead_ends, max_node)`,
